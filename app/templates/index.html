{% extends "base.html" %}

{% block title %}软件包列表 - GitHub deb 更新工具{% endblock %}

{% block content %}
<div x-data="packageList()" x-init="init()" x-cloak>
    <!-- 顶部统计 -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">总计</div>
            <div class="stat-value" x-text="total">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">已是最新</div>
            <div class="stat-value success" x-text="up_to_date">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">可更新</div>
            <div class="stat-value warning" x-text="update_available">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">未安装</div>
            <div class="stat-value muted" x-text="not_installed">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">错误</div>
            <div class="stat-value danger" x-text="errors">0</div>
        </div>
    </div>

    <!-- 操作栏 -->
    <div class="page-header">
        <h1 class="page-title">软件包管理</h1>
        <div class="btn-group">
            <button type="button"
                    class="btn btn-secondary"
                    @click="checkUpdates()"
                    :disabled="checking || upgrading">
                <span class="spinner" x-show="checking"></span>
                <span x-text="checking ? '检查中...' : '刷新'"></span>
            </button>
            <button type="button"
                    class="btn btn-primary"
                    @click="upgradeAll()"
                    :disabled="upgrading || checking || update_available === 0"
                    :title="update_available === 0 ? '当前没有可更新的软件包' : '更新所有可升级软件包'">
                <span class="spinner" x-show="upgrading && !currentUpgrade"></span>
                <span x-text="upgrading ? '更新中...' : '全部更新'"></span>
            </button>
        </div>
    </div>

    <!-- 列表 -->
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr>
                    <th>软件包</th>
                    <th>本地版本</th>
                    <th>最新版本</th>
                    <th>状态</th>
                    <th style="text-align:right">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr x-show="loading && packages.length === 0" class="loading-row">
                    <td colspan="5">
                        <div class="inline-loading" style="justify-content:center">
                            <span class="spinner lg"></span>
                            <span>正在检查更新（请求 GitHub，可能需要十几秒）...</span>
                        </div>
                    </td>
                </tr>

                <template x-for="pkg in packages" :key="pkg.name">
                    <tr>
                        <td>
                            <div class="pkg-name" x-text="pkg.display_name"></div>
                            <div class="pkg-repo" x-text="pkg.repo"></div>
                        </td>
                        <td x-text="pkg.local_version || '-'"></td>
                        <td x-text="pkg.latest_version || '-'"></td>
                        <td>
                            <span class="badge badge-success" x-show="pkg.status === 'up_to_date'">已是最新</span>
                            <span class="badge badge-warning" x-show="pkg.status === 'update_available'">可更新</span>
                            <span class="badge badge-muted" x-show="pkg.status === 'not_installed'">未安装</span>
                            <span class="badge badge-danger"
                                  x-show="pkg.status === 'error'"
                                  :title="pkg.error_message || ''">
                                错误
                            </span>
                            <div class="pkg-repo" x-show="pkg.status === 'error' && pkg.error_message"
                                 x-text="pkg.error_message" style="margin-top:0.25rem;max-width:14rem"></div>
                        </td>
                        <td class="actions">
                            <button type="button"
                                    class="btn btn-primary btn-sm"
                                    x-show="pkg.status === 'update_available' || pkg.status === 'not_installed'"
                                    @click="upgrade(pkg)"
                                    :disabled="upgrading || checking || isUpgrading(pkg.name)">
                                <span class="spinner" x-show="isUpgrading(pkg.name)"></span>
                                <span x-text="isUpgrading(pkg.name) ? '更新中' : (pkg.status === 'not_installed' ? '安装' : '更新')"></span>
                            </button>
                            <span x-show="pkg.status !== 'update_available' && pkg.status !== 'not_installed'"
                                  style="color:var(--gray-400)">-</span>
                        </td>
                    </tr>
                </template>

                <tr x-show="!loading && packages.length === 0">
                    <td colspan="5" class="empty-row">
                        暂无软件包。请到「设置」页添加，或编辑 packages.yaml。
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="meta-right">
        最后检查: <span x-text="checked_at"></span>
    </div>

    <!-- 更新进度遮罩 -->
    <div class="overlay" x-show="progress.show" x-cloak>
        <div class="overlay-card">
            <h3 class="overlay-title" x-text="progress.title">正在更新</h3>
            <p class="overlay-message" x-text="progress.message">请稍候...</p>
            <div class="progress-track">
                <div class="progress-bar"
                     :class="{ indeterminate: progress.indeterminate }"
                     :style="progress.indeterminate ? '' : ('width:' + progress.percent + '%')"></div>
            </div>
            <div class="meta-right" style="margin-top:0.75rem" x-show="!progress.indeterminate">
                <span x-text="progress.percent + '%'"></span>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast"
         x-show="notification.show"
         x-cloak
         :class="'toast-' + notification.type"
         role="status">
        <div class="toast-body" x-text="notification.message"></div>
        <button type="button" class="toast-close" @click="notification.show = false" aria-label="关闭">✕</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function packageList() {
    return {
        packages: [],
        total: 0,
        up_to_date: 0,
        update_available: 0,
        not_installed: 0,
        errors: 0,
        checked_at: '-',
        loading: true,
        checking: false,
        upgrading: false,
        upgradingPackages: [],
        currentUpgrade: null,
        progress: {
            show: false,
            title: '',
            message: '',
            percent: 0,
            indeterminate: true,
        },
        notification: {
            show: false,
            type: 'info',
            message: '',
        },
        _toastTimer: null,

        async init() {
            // 先快速加载本地列表，再检查 GitHub，避免首屏“卡住无响应”
            try {
                const local = await api.get('/packages/api/list');
                if (local.packages && local.packages.length) {
                    this.packages = local.packages;
                    this.total = local.packages.length;
                    this.not_installed = local.packages.filter(p => !p.local_version).length;
                    this.up_to_date = local.packages.length - this.not_installed;
                    this.loading = false;
                }
            } catch (e) {
                console.warn('本地列表加载失败，将直接检查更新', e);
            }
            await this.fetchPackages({ silent: true });
        },

        isUpgrading(name) {
            return this.upgradingPackages.includes(name);
        },

        showNotification(type, message) {
            if (this._toastTimer) clearTimeout(this._toastTimer);
            this.notification = { show: true, type, message };
            this._toastTimer = setTimeout(() => {
                this.notification.show = false;
            }, 4500);
        },

        showProgress(title, message, percent = null) {
            this.progress.show = true;
            this.progress.title = title;
            this.progress.message = message;
            if (percent === null || percent === undefined) {
                this.progress.indeterminate = true;
                this.progress.percent = 0;
            } else {
                this.progress.indeterminate = false;
                this.progress.percent = Math.max(0, Math.min(100, percent));
            }
        },

        hideProgress() {
            this.progress.show = false;
            this.progress.indeterminate = true;
            this.progress.percent = 0;
        },

        applyCheckResult(data) {
            this.packages = data.packages || [];
            this.total = data.total || 0;
            this.up_to_date = data.up_to_date || 0;
            this.update_available = data.update_available || 0;
            this.not_installed = data.not_installed || 0;
            this.errors = data.errors || 0;
            this.checked_at = data.checked_at
                ? new Date(data.checked_at).toLocaleString('zh-CN')
                : new Date().toLocaleString('zh-CN');
        },

        async fetchPackages({ silent = false } = {}) {
            if (!silent) this.checking = true;
            this.loading = this.packages.length === 0;
            try {
                const data = await api.get('/packages/api/check');
                this.applyCheckResult(data);
            } catch (e) {
                console.error('获取软件包列表失败:', e);
                this.showNotification('error', e.message || '获取软件包列表失败');
                throw e;
            } finally {
                this.loading = false;
                if (!silent) this.checking = false;
            }
        },

        async checkUpdates() {
            try {
                this.checking = true;
                this.showProgress('检查更新', '正在向 GitHub 查询最新版本...');
                await this.fetchPackages({ silent: true });
                this.showNotification('success', '已刷新软件包列表');
            } catch (e) {
                this.showNotification('error', e.message || '刷新失败');
            } finally {
                this.checking = false;
                this.hideProgress();
            }
        },

        upgrade(pkg) {
            const name = typeof pkg === 'string' ? pkg : pkg.name;
            const display = typeof pkg === 'string' ? pkg : (pkg.display_name || pkg.name);

            if (this.upgrading || this.isUpgrading(name)) return;

            this.upgrading = true;
            this.currentUpgrade = name;
            this.upgradingPackages = [...this.upgradingPackages, name];
            this.showProgress(`更新 ${display}`, '正在连接...', null);

            const finish = async (ok, message) => {
                this.upgradingPackages = this.upgradingPackages.filter((n) => n !== name);
                this.currentUpgrade = null;
                this.upgrading = this.upgradingPackages.length > 0;
                this.hideProgress();
                this.showNotification(ok ? 'success' : 'error', message);
                if (ok) {
                    try {
                        await this.fetchPackages({ silent: true });
                    } catch (e) {
                        /* 列表刷新失败不影响主结果 */
                    }
                }
            };

            const ws = new UpgradeWebSocket(name, {
                onChecking: (data) => {
                    this.showProgress(`更新 ${display}`, data.message || '正在获取版本信息...', null);
                },
                onDownloading: (data) => {
                    const p = typeof data.progress === 'number' ? data.progress : null;
                    this.showProgress(
                        `更新 ${display}`,
                        data.message || '正在下载...',
                        p
                    );
                },
                onInstalling: (data) => {
                    this.showProgress(`更新 ${display}`, data.message || '正在安装（需要 sudo）...', 100);
                },
                onCompleted: (data) => {
                    finish(true, data.message || `${display} 更新成功`);
                },
                onError: (data) => {
                    finish(false, (data && data.message) || `${display} 更新失败`);
                },
            });
            ws.connect();
        },

        async upgradeAll() {
            if (this.update_available === 0) {
                this.showNotification('info', '当前没有可更新的软件包');
                return;
            }
            if (!confirm(`确定要更新 ${this.update_available} 个软件包吗？这可能需要几分钟。`)) {
                return;
            }

            this.upgrading = true;
            this.showProgress('批量更新', '正在更新所有可升级软件包，请耐心等待...', null);

            try {
                const results = await api.post('/updates/api/upgrade-all', null, true);
                const list = Array.isArray(results) ? results : [];
                const successCount = list.filter((r) => r.success).length;
                const failCount = list.filter((r) => !r.success).length;
                const failed = list.filter((r) => !r.success);

                if (failCount === 0) {
                    this.showNotification('success', `成功处理 ${successCount} 个软件包`);
                } else {
                    const detail = failed
                        .slice(0, 3)
                        .map((r) => `${r.package_name}: ${r.message}`)
                        .join('；');
                    this.showNotification(
                        'info',
                        `完成: ${successCount} 成功, ${failCount} 失败。${detail}`
                    );
                }
                await this.fetchPackages({ silent: true });
            } catch (e) {
                this.showNotification('error', e.message || '批量更新失败');
            } finally {
                this.upgrading = false;
                this.hideProgress();
            }
        },
    };
}
</script>
{% endblock %}
