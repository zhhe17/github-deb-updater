{% extends "base.html" %}

{% block title %}软件包列表 - GitHub deb 更新工具{% endblock %}

{% block content %}
<div x-data="packageList()" x-init="init()">
    <!-- 顶部统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm font-medium text-gray-500">总计</div>
            <div class="mt-1 text-3xl font-semibold text-gray-900" x-text="total"></div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm font-medium text-gray-500">已是最新</div>
            <div class="mt-1 text-3xl font-semibold text-success" x-text="up_to_date"></div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm font-medium text-gray-500">可更新</div>
            <div class="mt-1 text-3xl font-semibold text-warning" x-text="update_available"></div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm font-medium text-gray-500">未安装</div>
            <div class="mt-1 text-3xl font-semibold text-gray-400" x-text="not_installed"></div>
        </div>
    </div>

    <!-- 操作栏 -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">软件包管理</h1>
        <div class="flex space-x-3">
            <button @click="checkUpdates()" 
                    :disabled="checking"
                    class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50">
                <svg class="w-4 h-4 mr-2" :class="{'animate-spin': checking}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span x-text="checking ? '检查中...' : '刷新'">刷新</span>
            </button>
            <button @click="upgradeAll()" 
                    :disabled="upgrading || update_available === 0"
                    class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span x-text="upgrading ? '更新中...' : '全部更新'">全部更新</span>
            </button>
        </div>
    </div>

    <!-- 软件包列表 -->
    <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">软件包</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">本地版本</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">最新版本</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="pkg in packages" :key="pkg.name">
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div>
                                    <div class="text-sm font-medium text-gray-900" x-text="pkg.display_name"></div>
                                    <div class="text-sm text-gray-500" x-text="pkg.repo"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900" x-text="pkg.local_version || '-'"></div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900" x-text="pkg.latest_version || '-'"></div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span x-show="pkg.status === 'up_to_date'"
                                  class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                已是最新
                            </span>
                            <span x-show="pkg.status === 'update_available'"
                                  class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">
                                可更新
                            </span>
                            <span x-show="pkg.status === 'not_installed'"
                                  class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
                                未安装
                            </span>
                            <span x-show="pkg.status === 'error'"
                                  class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800"
                                  :title="pkg.error_message">
                                错误
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button x-show="pkg.status === 'update_available' || pkg.status === 'not_installed'"
                                    @click="upgrade(pkg.name)"
                                    :disabled="upgradingPackages.includes(pkg.name)"
                                    class="inline-flex items-center px-3 py-1.5 border border-transparent rounded-md text-sm font-medium text-white bg-primary hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary disabled:opacity-50">
                                <svg x-show="upgradingPackages.includes(pkg.name)" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                <span x-text="upgradingPackages.includes(pkg.name) ? '更新中' : '更新'"></span>
                            </button>
                            <span x-show="pkg.status !== 'update_available' && pkg.status !== 'not_installed'"
                                  class="text-gray-400">-</span>
                        </td>
                    </tr>
                </template>
                <tr x-show="packages.length === 0">
                    <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                        暂无软件包数据
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 更新时间 -->
    <div class="mt-4 text-sm text-gray-500 text-right">
        最后检查: <span x-text="checked_at"></span>
    </div>

    <!-- 通知弹窗 -->
    <div x-show="notification.show" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         class="fixed bottom-4 right-4 z-50">
        <div class="rounded-lg shadow-lg p-4 max-w-sm"
             :class="{
                'bg-green-500 text-white': notification.type === 'success',
                'bg-red-500 text-white': notification.type === 'error',
                'bg-blue-500 text-white': notification.type === 'info',
             }">
            <div class="flex items-center">
                <span x-text="notification.message"></span>
                <button @click="notification.show = false" class="ml-4 text-white hover:text-gray-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function packageList() {
    return {
        packages: [],
        total: 0,
        up_to_date: 0,
        update_available: 0,
        not_installed: 0,
        checked_at: '-',
        checking: false,
        upgrading: false,
        upgradingPackages: [],
        notification: {
            show: false,
            type: 'info',
            message: '',
        },

        async init() {
            await this.fetchPackages();
        },

        async fetchPackages() {
            try {
                const data = await api.get('/packages/api/check');
                this.packages = data.packages || [];
                this.total = data.total || 0;
                this.up_to_date = data.up_to_date || 0;
                this.update_available = data.update_available || 0;
                this.not_installed = data.not_installed || 0;
                this.checked_at = data.checked_at
                    ? new Date(data.checked_at).toLocaleString('zh-CN')
                    : new Date().toLocaleString('zh-CN');
            } catch (e) {
                console.error('获取软件包列表失败:', e);
                this.showNotification('error', '获取软件包列表失败');
            }
        },

        showNotification(type, message) {
            this.notification = { show: true, type, message };
            setTimeout(() => {
                this.notification.show = false;
            }, 3000);
        },

        async checkUpdates() {
            this.checking = true;
            try {
                await this.fetchPackages();
                this.showNotification('success', '已刷新软件包列表');
            } catch (e) {
                this.showNotification('error', '刷新失败');
            } finally {
                this.checking = false;
            }
        },

        async upgrade(name) {
            this.upgradingPackages.push(name);
            try {
                const response = await fetch(`/updates/api/upgrade/${name}`, {
                    method: 'POST',
                });
                const result = await response.json();
                
                if (response.ok && result.success) {
                    this.showNotification('success', `${name} 更新成功`);
                    await this.fetchPackages();
                } else {
                    this.showNotification('error', result.message || '更新失败');
                }
            } catch (e) {
                this.showNotification('error', '网络错误');
            } finally {
                this.upgradingPackages = this.upgradingPackages.filter(n => n !== name);
            }
        },

        async upgradeAll() {
            if (!confirm('确定要更新所有软件包吗？')) return;
            
            this.upgrading = true;
            try {
                const response = await fetch('/updates/api/upgrade-all', {
                    method: 'POST',
                });
                const results = await response.json();
                
                const successCount = results.filter(r => r.success).length;
                const failCount = results.filter(r => !r.success).length;
                
                if (failCount === 0) {
                    this.showNotification('success', `成功更新 ${successCount} 个软件包`);
                } else {
                    this.showNotification('info', `更新完成: ${successCount} 成功, ${failCount} 失败`);
                }
                
                await this.fetchPackages();
            } catch (e) {
                this.showNotification('error', '网络错误');
            } finally {
                this.upgrading = false;
            }
        },
    };
}
</script>
{% endblock %}
