<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GitHub deb 更新工具{% endblock %}</title>
    <!-- 全部本地资源，避免 CDN 不可达导致页面完全无响应 -->
    <link rel="stylesheet" href="/static/css/style.css">
    <script defer src="/static/js/alpine.min.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body class="page">
    <nav class="navbar">
        <div class="container navbar-inner">
            <a href="/" class="brand">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span>deb 更新工具</span>
            </a>
            <div class="nav-links">
                <a href="/packages/" class="nav-link">软件包</a>
                <a href="/settings/" class="nav-link">设置</a>
                <a href="/docs" target="_blank" class="nav-link muted">API 文档</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>GitHub deb 软件自动更新工具 v2.0</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
